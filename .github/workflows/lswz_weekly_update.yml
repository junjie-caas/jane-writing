name: Weekly LSWZ Data Update

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC
  workflow_dispatch:

jobs:
  update-lswz-table:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch latest lswz purchase data
        run: |
          python tools/lswz_scraper.py \
            --out-csv data/lswz_purchase_data.csv \
            --out-md data/lswz_purchase_data.md

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes"
          else
            git add data/lswz_purchase_data.csv data/lswz_purchase_data.md
            git commit -m "chore: weekly update lswz purchase data"
            git push
          fi
